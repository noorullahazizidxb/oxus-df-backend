# File: deploy/nginx/nginx.conf
# Usage: Development reverse proxy in front of the API (port 8080 on your machine).
#        In production add TLS, certificate pinning support, stricter limits,
#        and serve the admin panel static files here.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream api_upstream {
    server api:8080;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    # Metrics are for Prometheus on the internal network only.
    location = /metrics {
        return 404;
    }

    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
